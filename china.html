<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stage 2: China</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100vh; }
  body{
    background:#0c0c0e;
    color:#f2eafe;
    font-family:"Proxima Nova", "proxima-nova", "Mulish", "Helvetica Neue", Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1.25rem; text-align:center; padding:4rem 1.5rem;
  }
  .flag{ font-size:64px; line-height:1; }
  h1{
    margin:0; font-weight:500; font-size:clamp(28px,6vw,56px);
    letter-spacing:0.06em; text-transform:uppercase;
    text-shadow:0 0 10px rgba(196,132,252,0.65), 0 0 26px rgba(196,132,252,0.4), 0 0 52px rgba(196,132,252,0.25);
  }
  p{ margin:0; max-width:36rem; font-size:17px; line-height:1.6; color:#c9c6d1; }
  a{
    margin-top:1rem; color:#f2eafe; text-decoration:none; font-size:13px;
    letter-spacing:0.12em; text-transform:uppercase;
    border:1px solid #c084fc; padding:0.7rem 1.4rem; border-radius:999px;
    transition:background .2s, color .2s;
  }
  a:hover, a:focus-visible{ background:#c084fc; color:#0c0c0e; }
</style>
</head>
<body>
  <div class="flag" aria-hidden="true">🇨🇳</div>
  <h1>Stage 2: China</h1>
  <p>The next chapter — life in Shanghai. Swap this copy and add photos for your years in China.</p>
  <a href="./">Back to the yin and yang</a>
</body>
</html>
