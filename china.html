<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stage 2: China</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="scrapbook.css" />
<style>
  :root{ --paper:#cc2229; --scrib:#ffffff; }
</style>
</head>
<body>
<div class="board">
  <svg class="st " style="--x:3%;--y:5%;--s:22vmin;--r:-8deg;color:#ffd23f" aria-hidden="true"><use href="scrapbook.svg#sun" width="100%" height="100%"/></svg>
  <svg class="st " style="--x:44%;--y:2%;--s:12vmin;--r:8deg;color:#ff8fa3" aria-hidden="true"><use href="scrapbook.svg#heart" width="100%" height="100%"/></svg>
  <svg class="st " style="--x:72%;--y:3%;--s:13vmin;--r:12deg;color:#fff3b0" aria-hidden="true"><use href="scrapbook.svg#star" width="100%" height="100%"/></svg>
  <svg class="st opt" style="--x:27%;--y:9%;--s:16vmin;--r:-12deg;color:#ffd23f" aria-hidden="true"><use href="scrapbook.svg#butterfly" width="100%" height="100%"/></svg>
  <svg class="st opt" style="--x:60%;--y:9%;--s:7vmin;--r:0deg;color:#fff" aria-hidden="true"><use href="scrapbook.svg#sparkle" width="100%" height="100%"/></svg>
  <svg class="st scrib opt" style="--x:66%;--y:12%;--s:17vmin;--r:0deg" aria-hidden="true"><use href="scrapbook.svg#ball1" width="100%" height="100%"/></svg>
  <i class="glit " style="--x:2%;--y:31%;--s:9vmin;--c:#d4a017" aria-hidden="true"></i>
  <i class="glit " style="--x:88%;--y:6%;--s:8vmin;--c:#7a0c14" aria-hidden="true"></i>
  <i class="glit opt" style="--x:91%;--y:40%;--s:10vmin;--c:#ff6b3d" aria-hidden="true"></i>
  <i class="glit opt" style="--x:5%;--y:64%;--s:8vmin;--c:#9b0f1a" aria-hidden="true"></i>
  <svg class="st opt" style="--x:89%;--y:24%;--s:10vmin;--r:-10deg;color:#ffd23f" aria-hidden="true"><use href="scrapbook.svg#star" width="100%" height="100%"/></svg>
  <svg class="st " style="--x:3%;--y:46%;--s:13vmin;--r:-10deg;color:#7a0c14" aria-hidden="true"><use href="scrapbook.svg#heart" width="100%" height="100%"/></svg>
  <svg class="st scrib opt" style="--x:2%;--y:56%;--s:17vmin;--r:0deg" aria-hidden="true"><use href="scrapbook.svg#diamond" width="100%" height="100%"/></svg>
  <svg class="st " style="--x:82%;--y:60%;--s:17vmin;--r:15deg;color:#ff9fb2" aria-hidden="true"><use href="scrapbook.svg#butterfly" width="100%" height="100%"/></svg>
  <svg class="st front" style="--x:1%;--y:82%;--s:16vmin;--r:-14deg;color:#fff3b0" aria-hidden="true"><use href="scrapbook.svg#butterfly" width="100%" height="100%"/></svg>
  <svg class="st " style="--x:76%;--y:82%;--s:15vmin;--r:6deg;color:#ffe9a8" aria-hidden="true"><use href="scrapbook.svg#flower" width="100%" height="100%"/></svg>
  <svg class="st opt" style="--x:88%;--y:78%;--s:11vmin;--r:12deg;color:#ffd23f" aria-hidden="true"><use href="scrapbook.svg#heart" width="100%" height="100%"/></svg>
  <svg class="st " style="--x:18%;--y:86%;--s:12vmin;--r:-15deg;color:#ffd23f" aria-hidden="true"><use href="scrapbook.svg#star" width="100%" height="100%"/></svg>
  <svg class="st opt" style="--x:36%;--y:90%;--s:8vmin;--r:0deg;color:#ffd23f" aria-hidden="true"><use href="scrapbook.svg#sparkle" width="100%" height="100%"/></svg>
  <svg class="st scrib opt" style="--x:50%;--y:90%;--s:16vmin;--r:-6deg" aria-hidden="true"><use href="scrapbook.svg#scrib1" width="100%" height="100%"/></svg>
  <svg class="st scrib opt" style="--x:24%;--y:2%;--s:15vmin;--r:8deg" aria-hidden="true"><use href="scrapbook.svg#scrib2" width="100%" height="100%"/></svg>
  <i class="gem " style="--x:92%;--y:70%;--s:7vmin;--c:#ffd23f" aria-hidden="true"></i>
  <i class="gem " style="--x:3%;--y:90%;--s:8vmin;--c:#ff8fa3" aria-hidden="true"></i>
  <i class="gem opt" style="--x:60%;--y:91%;--s:6vmin;--c:#f28c28" aria-hidden="true"></i>
  <i class="gem opt" style="--x:34%;--y:1%;--s:6vmin;--c:#fff3b0" aria-hidden="true"></i>
  <span class="st emo opt" style="--x:87%;--y:84%;--s:14vmin;--r:8deg" aria-hidden="true">🏮</span>
  <span class="st emo opt" style="--x:13%;--y:30%;--s:9vmin;--r:-12deg" aria-hidden="true">🥟</span>
  <span class="st emo opt" style="--x:55%;--y:3%;--s:12vmin;--r:6deg" aria-hidden="true">🧧</span>

  <main class="center">
    <div class="title-wrap">
      <svg class="st scrib orbit" aria-hidden="true"><use href="scrapbook.svg#orbit" width="100%" height="100%"/></svg>
      <span class="label">Stage 2</span>
      <div class="tiles"><div class="word"><span class="tile">C</span><span class="tile">H</span><span class="tile">I</span><span class="tile">N</span><span class="tile">A</span></div></div>
      <div class="flag-sticker" aria-hidden="true">🇨🇳</div>
    </div>

    <div class="row">
      <figure class="polaroid" style="--r:-6deg;--a:#ffd6a0;--b:#ff9a7a"><span class="tape"></span><div class="pic">📷</div><figcaption>Shanghai</figcaption></figure>
      <div class="note"><span class="tape"></span><p>The next chapter — life in Shanghai. Swap this copy and add photos for your years in China.</p></div>
      <figure class="polaroid" style="--r:5deg;--a:#ffe9a3;--b:#f28c8c"><span class="tape"></span><div class="pic">📷</div><figcaption>add a photo</figcaption></figure>
    </div>

    <a class="back" href="./">&larr; back to the yin and yang</a>
  </main>
</div>
<script src="transitions.js"></script>
<script>
  // Going home replays this page's transition in the opposite direction (left to right), wiping to the homepage's black.
  document.querySelector('.back').addEventListener('click', function (e) {
    if (!window.PageTransitions) return;
    e.preventDefault();
    window.PageTransitions.play('china', this.getAttribute('href'), { wipe: '#000000' });
  });
</script>
</body>
</html>
