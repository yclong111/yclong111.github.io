<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Story of My Life</title>
<style>
  :root{
    --bg:#07070a;
    --light:#f2f0e8;
    --white:#f4f2f1;
    --dark:#0c0c0e;
    --lightglow:#7dd3fc;
    --darkglow:#c084fc;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:radial-gradient(ellipse at 50% 30%, #14141a 0%, #07070a 60%);
    min-height:100vh;
    font-family:"Times New Roman", Times, serif;
    overflow-x:hidden;
  }

  /* ---- scroll-zoom hero ---- */
  .hero-scroll{
    position:relative;
    height:340vh;
  }
  .hero-sticky{
    position:sticky;
    top:0;
    height:100vh;
    overflow:hidden;
    perspective:1400px;
  }
  .zoom-layer{
    position:relative;
    width:100%;
    height:100%;
    will-change:transform;
    transform-style:preserve-3d;
    backface-visibility:hidden;
  }
  .scroll-hint{
    position:absolute;
    left:50%;
    bottom:2.5rem;
    transform:translateX(-50%);
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:#9a9a9a;
    z-index:1;
    animation:hint-bounce 1.8s ease-in-out infinite;
  }
  @keyframes hint-bounce{
    0%,100%{ transform:translate(-50%,0); opacity:0.7; }
    50%{ transform:translate(-50%,6px); opacity:1; }
  }

  /* ---- image corridor (background) ---- */
  .corridor-wrap{
    position:absolute;
    inset:0;
    overflow:hidden;
    container-type: inline-size;
    z-index:0;
  }
  .corridor-perspective{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .corridor-stage{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
  }
  .corridor-card{
    position:absolute;
    overflow:hidden;
    background-size:cover;
    background-position:center;
    backface-visibility:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .corridor-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .corridor-fade{
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse at 50% 55%, transparent 0%, rgba(7,7,10,0.55) 55%, rgba(7,7,10,0.92) 100%);
    pointer-events:none;
  }

  /* ---- foreground content ---- */
  .page{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2.5rem;
    min-height:100vh;
    padding:5rem 1.5rem 6rem;
    text-align:center;
  }
  h1{
    margin:0;
    font-weight:500;
    font-size:clamp(28px,5vw,48px);
    letter-spacing:0.02em;
    color:#f5f5f5;
    text-shadow:
      0 0 8px rgba(255,255,255,0.55),
      0 0 22px rgba(196,181,253,0.45),
      0 0 46px rgba(125,211,252,0.3);
  }
  .yy{ position:relative; }
  .yy svg{ display:block; overflow:visible; animation:spin 22s linear infinite; }
  .half{ cursor:pointer; transition:filter .35s ease; transform-box:fill-box; transform-origin:center; }
  .light{ filter:drop-shadow(0 0 8px #7dd3fc70) drop-shadow(0 0 20px #7dd3fc35) drop-shadow(0 14px 24px rgba(0,0,0,0.55)); }
  .dark{ filter:drop-shadow(0 0 8px #c084fc70) drop-shadow(0 0 20px #c084fc35) drop-shadow(0 14px 24px rgba(0,0,0,0.6)); }
  .half:hover{ filter:drop-shadow(0 0 14px currentColor) drop-shadow(0 0 34px currentColor) drop-shadow(0 14px 24px rgba(0,0,0,0.6)); }
  .caption{
    font-size:15px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    min-height:22px;
    color:#e6e6e6;
    font-weight:500;
    text-shadow:0 0 10px currentColor, 0 0 24px currentColor;
    opacity:0;
    transition:opacity .25s ease;
  }
  .caption.show{ opacity:1; }
  .caption.stage1{ color:var(--lightglow); }
  .caption.stage2{ color:var(--darkglow); }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){
    .yy svg{ animation:none; }
    .corridor-card{ animation-play-state:paused !important; }
  }

  /* ---- stage 1 page (revealed after the zoom) ---- */
  .stage3-section{
    position:relative;
    z-index:1;
    min-height:100vh;
    background:var(--white);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1.25rem;
    text-align:center;
    padding:4rem 1.5rem;
  }
  .stage3-section h2{
    margin:0;
    font-weight:500;
    font-size:clamp(24px,4.5vw,42px);
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:#1c2b33;
    text-shadow:
      0 0 10px rgba(125,211,252,0.55),
      0 0 26px rgba(125,211,252,0.35),
      0 0 52px rgba(125,211,252,0.2);
  }
  .stage3-section p{
    margin:0;
    max-width:36rem;
    font-size:16px;
    line-height:1.6;
    color:#4a4a4a;
  }
</style>
</head>
<body>

  <div class="hero-scroll" id="heroScroll">
    <div class="hero-sticky">
      <div class="zoom-layer" id="zoomLayer">
        <div class="corridor-wrap" id="corridorWrap" aria-hidden="true">
          <div class="corridor-perspective" id="corridorPerspective">
            <div class="corridor-stage" id="corridorStage"></div>
          </div>
          <div class="corridor-fade"></div>
        </div>

        <div class="page">
          <h1 id="heroTitle">The Story of My Life</h1>

          <div class="yy">
            <svg viewBox="0 0 200 200" width="280" height="280" role="group" aria-label="Yin yang, stages of life">
              <defs>
                <radialGradient id="lightGrad" cx="38%" cy="32%" r="75%">
                  <stop offset="0%" stop-color="#ffffff"></stop>
                  <stop offset="55%" stop-color="#f2f0e8"></stop>
                  <stop offset="100%" stop-color="#b9b6a8"></stop>
                </radialGradient>
                <radialGradient id="darkGrad" cx="62%" cy="68%" r="80%">
                  <stop offset="0%" stop-color="#2b2b30"></stop>
                  <stop offset="45%" stop-color="#141416"></stop>
                  <stop offset="100%" stop-color="#020202"></stop>
                </radialGradient>
                <radialGradient id="lightDot" cx="35%" cy="30%" r="75%">
                  <stop offset="0%" stop-color="#ffffff"></stop>
                  <stop offset="100%" stop-color="#cfccc0"></stop>
                </radialGradient>
                <radialGradient id="darkDot" cx="35%" cy="30%" r="75%">
                  <stop offset="0%" stop-color="#3a3a40"></stop>
                  <stop offset="100%" stop-color="#000000"></stop>
                </radialGradient>
                <radialGradient id="rim" cx="50%" cy="50%" r="50%">
                  <stop offset="80%" stop-color="#000000" stop-opacity="0"></stop>
                  <stop offset="100%" stop-color="#000000" stop-opacity="0.35"></stop>
                </radialGradient>
              </defs>

              <circle id="lightHalf" class="half light" cx="100" cy="100" r="98" fill="url(#lightGrad)" style="color:#7dd3fc" role="button" tabindex="0" aria-label="Stage 1: the US"></circle>
              <path id="darkHalf" class="half dark" d="M100,2 A98,98 0 0,1 100,198 A49,49 0 0,1 100,100 A49,49 0 0,0 100,2 Z" fill="url(#darkGrad)" style="color:#c084fc" role="button" tabindex="0" aria-label="Stage 2: china"></path>

              <circle cx="100" cy="51" r="15" fill="url(#darkDot)" pointer-events="none"></circle>
              <circle cx="100" cy="149" r="15" fill="url(#lightDot)" pointer-events="none"></circle>

              <circle cx="100" cy="100" r="98" fill="url(#rim)" pointer-events="none"></circle>
            </svg>
          </div>
          <div class="caption" id="caption"></div>
        </div>
      </div>

      <div class="scroll-hint" id="scrollHint">Scroll to continue</div>
    </div>
  </div>

  <section class="stage3-section" id="stage3">
    <h2>Stage 3: The Present</h2>
    <p>Where the story lands today. Swap this copy and add photos for what you're doing now.</p>
  </section>

<script>
(function () {
  /* ============ yin-yang hover captions ============ */
  var lightHalf = document.getElementById('lightHalf');
  var darkHalf = document.getElementById('darkHalf');
  var caption = document.getElementById('caption');

  function show(text, cls) {
    caption.textContent = text;
    caption.className = 'caption show ' + cls;
  }
  function hide() { caption.className = 'caption'; }

  lightHalf.addEventListener('mouseenter', function () { show('Stage 1: the US', 'stage1'); });
  lightHalf.addEventListener('focus', function () { show('Stage 1: the US', 'stage1'); });
  darkHalf.addEventListener('mouseenter', function () { show('Stage 2: china', 'stage2'); });
  darkHalf.addEventListener('focus', function () { show('Stage 2: china', 'stage2'); });
  lightHalf.addEventListener('mouseleave', hide);
  lightHalf.addEventListener('blur', hide);
  darkHalf.addEventListener('mouseleave', hide);
  darkHalf.addEventListener('blur', hide);

  function go(url) { return function (e) {
    if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    window.location.href = url;
  }; }
  lightHalf.addEventListener('click', go('us.html'));
  lightHalf.addEventListener('keydown', go('us.html'));
  darkHalf.addEventListener('click', go('china.html'));
  darkHalf.addEventListener('keydown', go('china.html'));

  /* ============ image corridor ============
   * Ported from the ImageStreamHero geometry: cards ride two mirrored
   * rails from far behind the screen toward the viewer. Depth is
   * authored as geometric apparent size so the ribbon stays solid at
   * both ends; a negative birth offset means each card is born across
   * the centre axis, so the corridor's throat never blinks open.
   *
   * Drop your own photos in images/photo1.jpg ... photo12.jpg (or edit
   * the IMAGES array below) — placeholders are used until you do.
   */
  var IMAGES = [
    "images/photo1.jpg",
    "images/photo2.jpg",
    "images/photo3.jpg",
    "images/photo4.jpg",
    "images/photo5.jpg",
    "images/photo6.jpg",
    "images/photo7.jpg",
    "images/photo8.jpg",
    "images/photo9.jpg",
    "images/photo10.jpg",
    "images/photo11.jpg",
    "images/photo12.jpg"
  ];
  // Placeholder fallbacks (used automatically if a local photo fails to load)
  var PLACEHOLDER_SEEDS = ["life1","life2","life3","life4","life5","life6","life7","life8","life9","life10","life11","life12"];

  var PATH = {
    perspective: 30,
    cardWidth: 18,
    cardHeight: 25,
    cardRadius: 0.6,
    birthHeight: 2.6,
    exitHeight: 46,
    railBirth: -11,
    railExit: 44,
    fan: 3.3,
    turnBirth: 6,
    turnExit: 28,
    stops: 24
  };
  var CARDS = 9;
  var SPEED = 20;
  var AXIS = 55;

  function keyframes(dir, name, p) {
    var steps = [];
    for (var s = 0; s <= p.stops; s++) {
      var u = s / p.stops;
      var scale = (p.birthHeight / p.cardHeight) * Math.pow(p.exitHeight / p.birthHeight, u);
      var z = p.perspective * (1 - 1 / scale);
      var rail = p.railExit - (p.railExit - p.railBirth) * Math.pow(1 - u, p.fan);
      var turn = p.turnBirth + (p.turnExit - p.turnBirth) * u;
      steps.push(
        (u * 100).toFixed(2) + '%{transform:translate3d(' +
        (dir * rail).toFixed(2) + 'cqw,0,' + z.toFixed(2) + 'cqw) rotateY(' +
        (-dir * turn).toFixed(2) + 'deg)}'
      );
    }
    return '@keyframes ' + name + '{' + steps.join('') + '}';
  }

  var perspectiveEl = document.getElementById('corridorPerspective');
  var stageEl = document.getElementById('corridorStage');

  perspectiveEl.style.perspective = PATH.perspective + 'cqw';
  perspectiveEl.style.perspectiveOrigin = '50% ' + AXIS + '%';

  var right = 'ish-r';
  var left = 'ish-l';
  var css = keyframes(1, right, PATH) + keyframes(-1, left, PATH);
  var styleTag = document.createElement('style');
  styleTag.textContent = css;
  document.head.appendChild(styleTag);

  [right, left].forEach(function (name) {
    for (var i = 0; i < CARDS; i++) {
      var src = IMAGES[i % IMAGES.length];
      var seed = PLACEHOLDER_SEEDS[i % PLACEHOLDER_SEEDS.length];
      var card = document.createElement('div');
      card.className = 'corridor-card';
      card.style.left = '50%';
      card.style.top = AXIS + '%';
      card.style.width = PATH.cardWidth + 'cqw';
      card.style.height = PATH.cardHeight + 'cqw';
      card.style.marginLeft = (-PATH.cardWidth / 2) + 'cqw';
      card.style.marginTop = (-PATH.cardHeight / 2) + 'cqw';
      card.style.borderRadius = PATH.cardRadius + 'cqw';
      card.style.animation = name + ' ' + SPEED + 's linear infinite';
      card.style.animationDelay = (-(i * SPEED) / CARDS) + 's';

      var img = document.createElement('img');
      img.loading = 'lazy';
      img.decoding = 'async';
      img.draggable = false;
      img.alt = '';
      img.src = src;
      img.onerror = function (seedForThis) {
        return function () {
          this.onerror = null;
          this.src = 'https://picsum.photos/seed/' + seedForThis + '/400/560';
        };
      }(seed);

      card.appendChild(img);
      stageEl.appendChild(card);
    }
  });

  /* ============ scroll-driven zoom into the light half ============
   * The zoom layer scales up around a fixed point inside the light
   * half's bulge (dead centre of it, in the 200x200 viewBox), so by
   * the end of the scroll that flat white region alone has grown to
   * cover the whole frame — no cross-fade needed. A rotateY twist
   * rides along with the scale (mirroring the corridor cards' own
   * turnBirth -> turnExit sweep) so the zoom reads as a camera turning
   * in, not a flat scale. Because position:fixed descendants are
   * re-contained by a transformed ancestor, the corridor
   * (position:absolute inside the layer) scales and twists right along
   * with the symbol instead of staying pinned to the viewport.
   */
  var heroScroll = document.getElementById('heroScroll');
  var zoomLayer = document.getElementById('zoomLayer');
  var svgEl = document.querySelector('.yy svg');
  var scrollHint = document.getElementById('scrollHint');

  // Deepest inscribed point of the light half, in the SVG's own 200x200
  // viewBox space (found by rendering the SVG to a canvas and searching
  // for the white pixel farthest from any non-white pixel). Using the
  // SVG's own coordinate space — via getScreenCTM() below — rather than a
  // plain bounding-box fraction matters because the symbol keeps spinning
  // right up until scroll starts: a screen-pixel fraction would silently
  // go stale the moment the rotation moved on, landing the "safe" point
  // over the dark half instead.
  var SAFE_POINT = { x: 58, y: 76 };
  var SAFE_RADIUS_UNITS = 35; // clearance from SAFE_POINT to the nearest non-white pixel, in viewBox units (measured by sampling the rendered SVG)
  var SAFE_MARGIN = 0.5; // use only half the measured clearance: covers anti-aliasing/gradient softness at the boundary AND the rotateY twist, which foreshortens one side of the frame so it needs extra scale to still reach the edge
  var MAX_SCALE = 12; // recomputed from real measurements in updateOrigin(); this is just a safe fallback before the first measurement
  var TURN_START = 4;   // deg, matches the corridor's turnBirth
  var TURN_END = 26;    // deg, matches the corridor's turnExit

  var spinFrozen = false;
  function freezeSpin() {
    if (spinFrozen) return;
    spinFrozen = true;
    svgEl.style.animationPlayState = 'paused';
  }
  function unfreezeSpin() {
    if (!spinFrozen) return;
    spinFrozen = false;
    svgEl.style.animationPlayState = '';
  }

  // transform-origin must be expressed in the element's own LOCAL,
  // untransformed coordinate space. getScreenCTM() reports the SVG's
  // position after every ancestor transform is applied — including
  // zoomLayer's own current scale/rotate — so this briefly resets that
  // transform to measure cleanly, then restores it. Calling it while
  // already mid-zoom would otherwise feed a post-transform screen
  // position back in as the pre-transform origin, a circular reference
  // that made the maths blow up.
  function updateOrigin() {
    var prevTransform = zoomLayer.style.transform;
    zoomLayer.style.transform = 'none';
    void zoomLayer.offsetHeight; // force reflow before measuring
    var pt = svgEl.createSVGPoint();
    pt.x = SAFE_POINT.x;
    pt.y = SAFE_POINT.y;
    var ctm = svgEl.getScreenCTM();
    var screenPt = pt.matrixTransform(ctm);
    var layerRect = zoomLayer.getBoundingClientRect();
    var originX = screenPt.x - layerRect.left;
    var originY = screenPt.y - layerRect.top;
    zoomLayer.style.transformOrigin = originX + 'px ' + originY + 'px';

    // pxPerUnit: ctm.a/ctm.d scale the SVG's local x/y axes to screen px.
    // Work out how far the origin sits from each viewport edge, take the
    // largest (the far corner the zoom has to cover), and size MAX_SCALE
    // so the light half's own safe clearance — not a guessed constant —
    // is exactly what has to stretch that far.
    var pxPerUnit = (Math.abs(ctm.a) + Math.abs(ctm.d)) / 2;
    var safePx = SAFE_RADIUS_UNITS * SAFE_MARGIN * pxPerUnit;
    var originScreenX = originX + layerRect.left;
    var originScreenY = originY + layerRect.top;
    var reachX = Math.max(originScreenX, window.innerWidth - originScreenX);
    var reachY = Math.max(originScreenY, window.innerHeight - originScreenY);
    var reach = Math.sqrt(reachX * reachX + reachY * reachY);
    MAX_SCALE = Math.max(4, reach / safePx);

    zoomLayer.style.transform = prevTransform;
  }

  var ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      var rect = heroScroll.getBoundingClientRect();
      var scrollable = heroScroll.offsetHeight - window.innerHeight;
      var progress = scrollable > 0 ? Math.min(Math.max(-rect.top / scrollable, 0), 1) : 0;

      if (progress > 0) {
        if (!spinFrozen) {
          freezeSpin();
          updateOrigin();
        }
      } else {
        unfreezeSpin();
      }

      scrollHint.style.visibility = progress > 0.02 ? 'hidden' : '';
      var scale = 1 + progress * (MAX_SCALE - 1);
      var turn = TURN_START + (TURN_END - TURN_START) * progress;
      zoomLayer.style.transform = 'scale(' + scale.toFixed(3) + ') rotateY(' + turn.toFixed(2) + 'deg)';

      ticking = false;
    });
  }

  onScroll();
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', function () {
    if (spinFrozen) updateOrigin();
    onScroll();
  });
})();
</script>
</body>
</html>
