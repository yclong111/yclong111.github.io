<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Story of My Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#07070a;
    --light:#f2f0e8;
    --stage3:#0c0c0e;
    --dark:#0c0c0e;
    --lightglow:#7dd3fc;
    --darkglow:#ff3b3b;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:radial-gradient(ellipse at 50% 30%, #14141a 0%, #07070a 60%);
    min-height:100vh;
    font-family:"Libre Baskerville", Baskerville, "Times New Roman", serif;
    overflow-x:hidden;
  }

  /* ---- scroll-zoom hero ---- */
  .hero-scroll{
    position:relative;
    height:340vh;
  }
  .hero-scroll::before{
    content:""; position:absolute; left:0; right:0; top:0; height:45vh; z-index:0; pointer-events:none;
    background:linear-gradient(#000, rgba(0,0,0,0));
  }
  .hero-sticky{
    position:sticky;
    top:0;
    height:100vh;
    overflow:hidden;
    perspective:1400px;
  }
  .zoom-layer{
    position:relative;
    width:100%;
    height:100%;
    will-change:transform;
    transform-style:preserve-3d;
    backface-visibility:hidden;
  }
  .scroll-hint{
    position:absolute;
    left:50%;
    bottom:2.5rem;
    transform:translateX(-50%);
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:#9a9a9a;
    z-index:1;
    animation:hint-bounce 1.8s ease-in-out infinite;
  }
  @keyframes hint-bounce{
    0%,100%{ transform:translate(-50%,0); opacity:0.7; }
    50%{ transform:translate(-50%,6px); opacity:1; }
  }


  /* ---- pop-in animation ---- */
  @keyframes pop{
    0%{ opacity:0; transform:scale(.4) translateY(34px); }
    60%{ opacity:1; transform:scale(1.1) translateY(-5px); }
    100%{ opacity:1; transform:none; }
  }
  .pop-scroll{ opacity:0; }
  .pop-scroll.in{ animation:pop .75s cubic-bezier(.2,1.4,.4,1) both; animation-delay:var(--d,0s); }

  /* ---- quote page (first page) ---- */
  .quote-page{
    position:relative; min-height:100vh; min-height:100svh;
    background:#000; color:#f5f5f4;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:5rem 1.5rem 6rem; text-align:center;
  }
  .quote-text{
    margin:0;
    font-weight:700; font-size:clamp(26px,6vw,78px); line-height:1.25; letter-spacing:.005em;
    text-shadow:0 0 14px rgba(255,255,255,.35), 0 0 42px rgba(255,255,255,.14);
  }
  .quote-author{
    margin:clamp(1.5rem,4vw,2.75rem) 0 0;
    font-style:italic; font-weight:400; font-size:clamp(22px,3.6vw,44px); color:#d9d9d6;
  }
  .line{
    display:block; opacity:0; text-wrap:balance;
    animation:pop .5s cubic-bezier(.2,1.5,.4,1) forwards;
    animation-delay:calc(.1s + var(--i) * .28s);
  }
  .quote-cue{
    position:absolute; left:0; right:0; bottom:2.2rem;
    display:flex; flex-direction:column; align-items:center; gap:.5rem;
    font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:#8d8d8d;
    opacity:0; animation:pop .5s cubic-bezier(.2,1.5,.4,1) forwards; animation-delay:calc(.1s + var(--i) * .28s);
  }
  .quote-cue::after{
    content:""; width:9px; height:9px; border-right:2px solid #8d8d8d; border-bottom:2px solid #8d8d8d;
    transform:rotate(45deg); animation:cue-bob 1.6s ease-in-out infinite; animation-delay:2s;
  }
  @keyframes cue-bob{ 0%,100%{ transform:translateY(0) rotate(45deg); } 50%{ transform:translateY(6px) rotate(45deg); } }
  @media (prefers-reduced-motion: reduce){
    .line, .quote-cue, .pop-scroll{ opacity:1; animation:none !important; }
    .quote-cue::after{ animation:none; }
  }

  /* ---- foreground content ---- */
  .page{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2.5rem;
    min-height:100vh;
    padding:5rem 1.5rem 6rem;
    text-align:center;
  }
  h1{
    margin:0;
    font-weight:700;
    font-size:clamp(28px,5vw,48px);
    letter-spacing:0.02em;
    color:#f5f5f5;
    text-shadow:
      0 0 8px rgba(255,255,255,0.55),
      0 0 22px rgba(196,181,253,0.45),
      0 0 46px rgba(125,211,252,0.3);
  }
  .yy{ position:relative; }
  .yy svg{ display:block; overflow:visible; animation:spin 22s linear infinite; }
  .half{ cursor:pointer; transition:filter .35s ease; transform-box:fill-box; transform-origin:center; }
  .light{ filter:drop-shadow(0 0 8px #7dd3fc70) drop-shadow(0 0 20px #7dd3fc35) drop-shadow(var(--shx,0px) var(--shy,14px) 24px rgba(0,0,0,0.55)); }
  .dark{ filter:drop-shadow(0 0 8px #ff3b3b70) drop-shadow(0 0 20px #ff3b3b35) drop-shadow(var(--shx,0px) var(--shy,14px) 24px rgba(0,0,0,0.6)); }
  .half:hover{ filter:drop-shadow(0 0 14px currentColor) drop-shadow(0 0 34px currentColor) drop-shadow(var(--shx,0px) var(--shy,14px) 24px rgba(0,0,0,0.6)); }
  .caption{
    font-size:15px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    min-height:22px;
    color:#e6e6e6;
    font-weight:700;
    text-shadow:0 0 10px currentColor, 0 0 24px currentColor;
    opacity:0;
    transition:opacity .25s ease;
  }
  .caption.show{ opacity:1; }
  .caption.stage1{ color:var(--lightglow); }
  .caption.stage2{ color:var(--darkglow); }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){
    .yy svg{ animation:none; }
  }

  /* ---- stage 1 page (revealed after the zoom) ---- */
  .stage3-section{
    position:relative;
    z-index:1;
    min-height:100vh;
    background:var(--stage3);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1.25rem;
    text-align:center;
    padding:4rem 1.5rem;
  }
  .stage3-section h2{
    margin:0;
    font-weight:700;
    font-size:clamp(24px,4.5vw,42px);
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:#f5f5f4;
    text-shadow:
      0 0 10px rgba(255,255,255,0.45),
      0 0 26px rgba(255,255,255,0.25),
      0 0 52px rgba(255,255,255,0.15);
  }
  .stage3-section p{
    margin:0;
    max-width:36rem;
    font-size:16px;
    line-height:1.6;
    color:#c9c6d1;
  }
</style>
</head>
<body>

  <section class="quote-page" id="quote">
    <blockquote style="margin:0">
      <p class="quote-text"><span class="line" style="--i:0">“I live in two worlds,</span><span class="line" style="--i:1">neither of which</span><span class="line" style="--i:2">is entirely mine.”</span></p>
      <footer class="quote-author"><span class="line" style="--i:3">— Jhumpa Lahiri</span></footer>
    </blockquote>
    <div class="quote-cue" style="--i:4" aria-hidden="true">Scroll</div>
  </section>

  <div class="hero-scroll" id="heroScroll">
    <div class="hero-sticky">
      <div class="zoom-layer" id="zoomLayer">
        <div class="page">
          <h1 id="heroTitle" class="pop-scroll">The Story of My Life</h1>

          <div class="yy pop-scroll" style="--d:.15s">
            <svg viewBox="0 0 200 200" width="280" height="280" role="group" aria-label="Yin yang, stages of life">
              <defs>
                <radialGradient id="lightGrad" cx="38%" cy="32%" r="75%">
                  <stop offset="0%" stop-color="#ffffff"></stop>
                  <stop offset="55%" stop-color="#f2f0e8"></stop>
                  <stop offset="100%" stop-color="#b9b6a8"></stop>
                </radialGradient>
                <radialGradient id="darkGrad" cx="62%" cy="68%" r="80%">
                  <stop offset="0%" stop-color="#2b2b30"></stop>
                  <stop offset="45%" stop-color="#141416"></stop>
                  <stop offset="100%" stop-color="#020202"></stop>
                </radialGradient>
                <radialGradient id="lightDot" cx="35%" cy="30%" r="75%">
                  <stop offset="0%" stop-color="#ffffff"></stop>
                  <stop offset="100%" stop-color="#cfccc0"></stop>
                </radialGradient>
                <radialGradient id="darkDot" cx="35%" cy="30%" r="75%">
                  <stop offset="0%" stop-color="#3a3a40"></stop>
                  <stop offset="100%" stop-color="#000000"></stop>
                </radialGradient>
                <radialGradient id="rim" cx="50%" cy="50%" r="50%">
                  <stop offset="80%" stop-color="#000000" stop-opacity="0"></stop>
                  <stop offset="100%" stop-color="#000000" stop-opacity="0.35"></stop>
                </radialGradient>
              </defs>

              <circle id="lightHalf" class="half light" cx="100" cy="100" r="98" fill="url(#lightGrad)" style="color:#7dd3fc" role="button" tabindex="0" aria-label="Stage 1: the US"></circle>
              <path id="darkHalf" class="half dark" d="M100,2 A98,98 0 0,1 100,198 A49,49 0 0,1 100,100 A49,49 0 0,0 100,2 Z" fill="url(#darkGrad)" style="color:#ff3b3b" role="button" tabindex="0" aria-label="Stage 2: china"></path>

              <circle id="darkDotEl" cx="100" cy="51" r="15" fill="url(#darkDot)" pointer-events="none"></circle>
              <circle id="lightDotEl" cx="100" cy="149" r="15" fill="url(#lightDot)" pointer-events="none"></circle>

              <circle cx="100" cy="100" r="98" fill="url(#rim)" pointer-events="none"></circle>
            </svg>
          </div>
          <div class="caption" id="caption"></div>
        </div>
      </div>

      <div class="scroll-hint" id="scrollHint">Scroll to continue</div>
    </div>
  </div>

  <section class="stage3-section" id="stage3">
    <h2 class="pop-scroll">Stage 3: The Present</h2>
    <p class="pop-scroll" style="--d:.2s">Where the story lands today. Swap this copy and add photos for what you're doing now.</p>
  </section>

<script>
(function () {

  /* ============ pop elements in as they scroll into view ============ */
  var popEls = document.querySelectorAll('.pop-scroll');
  if ('IntersectionObserver' in window) {
    var popObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('in'); popObserver.unobserve(e.target); }
      });
    }, { threshold: 0.35 });
    popEls.forEach(function (el) { popObserver.observe(el); });
  } else {
    popEls.forEach(function (el) { el.classList.add('in'); });
  }

  /* ============ yin-yang hover captions ============ */
  var lightHalf = document.getElementById('lightHalf');
  var darkHalf = document.getElementById('darkHalf');
  var caption = document.getElementById('caption');

  function show(text, cls) {
    caption.textContent = text;
    caption.className = 'caption show ' + cls;
  }
  function hide() { caption.className = 'caption'; }

  lightHalf.addEventListener('mouseenter', function () { show('Stage 1: the US', 'stage1'); });
  lightHalf.addEventListener('focus', function () { show('Stage 1: the US', 'stage1'); });
  darkHalf.addEventListener('mouseenter', function () { show('Stage 2: china', 'stage2'); });
  darkHalf.addEventListener('focus', function () { show('Stage 2: china', 'stage2'); });
  lightHalf.addEventListener('mouseleave', hide);
  lightHalf.addEventListener('blur', hide);
  darkHalf.addEventListener('mouseleave', hide);
  darkHalf.addEventListener('blur', hide);

  function go(url) { return function (e) {
    if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    window.location.href = url;
  }; }
  lightHalf.addEventListener('click', go('us.html'));
  lightHalf.addEventListener('keydown', go('us.html'));
  darkHalf.addEventListener('click', go('china.html'));
  darkHalf.addEventListener('keydown', go('china.html'));

  /* ============ scroll-driven zoom into the dark half ============
   * The zoom layer scales up around a fixed point inside the dark
   * half (its deepest inscribed point, in the 200x200 viewBox), so by
   * the end of the scroll that flat black region alone has grown to
   * cover the whole frame — no cross-fade needed. A rotateY twist
   * rides along with the scale so the zoom reads as a camera turning
   * in, not a flat scale.
   */
  var heroScroll = document.getElementById('heroScroll');
  var zoomLayer = document.getElementById('zoomLayer');
  var svgEl = document.querySelector('.yy svg');
  var scrollHint = document.getElementById('scrollHint');

  // As the zoom progresses, the dark half's gradient stops blend toward the
  // next page's colour, so the frame is already exactly that colour by the
  // time it fills the screen and the handoff has no visible seam.
  var TARGET_COLOR = [12, 12, 14]; // #0c0c0e, matches --stage3
  var BLEND_STOP_ELS = Array.prototype.slice.call(document.querySelectorAll('#darkGrad stop'));
  function hexToRgb(h) {
    h = h.replace('#', '');
    return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
  }
  var BLEND_STOP_ORIGINALS = BLEND_STOP_ELS.map(function (el) { return hexToRgb(el.getAttribute('stop-color')); });
  var BLEND_DONE_AT = 0.9; // fully blended a little before the end, so the last stretch of zoom is one flat colour
  function blendStops(progress) {
    var t = Math.min(progress / BLEND_DONE_AT, 1);
    BLEND_STOP_ELS.forEach(function (el, i) {
      var o = BLEND_STOP_ORIGINALS[i];
      var r = Math.round(o[0] + (TARGET_COLOR[0] - o[0]) * t);
      var g = Math.round(o[1] + (TARGET_COLOR[1] - o[1]) * t);
      var b = Math.round(o[2] + (TARGET_COLOR[2] - o[2]) * t);
      el.setAttribute('stop-color', 'rgb(' + r + ',' + g + ',' + b + ')');
    });
  }

  // ---- fixed lighting on a spinning disc ----
  // The gradients (and the drop shadow) live in the SVG's own coordinate
  // space, so they'd spin with it and the "sun" would circle the ball. To
  // keep the light fixed on screen, read the disc's current rotation every
  // frame and counter-rotate each gradient (and the shadow offset) by it.
  // Gradients are converted to userSpaceOnUse first: objectBoundingBox
  // units skew a rotation whenever a shape's bounding box isn't square
  // (the dark half's isn't). Because it's driven by the live angle, it
  // stays correct whether the disc is spinning, frozen mid-scroll, or
  // stopped by prefers-reduced-motion.
  var LIGHTING = [
    { id: 'lightGrad', shape: lightHalf, cx: 0.38, cy: 0.32, r: 0.75, pivotOnSvg: true },
    { id: 'darkGrad', shape: darkHalf, cx: 0.62, cy: 0.68, r: 0.80, pivotOnSvg: true },
    { id: 'lightDot', shape: document.getElementById('lightDotEl'), cx: 0.35, cy: 0.30, r: 0.75, pivotOnSvg: false },
    { id: 'darkDot', shape: document.getElementById('darkDotEl'), cx: 0.35, cy: 0.30, r: 0.75, pivotOnSvg: false }
  ];
  LIGHTING.forEach(function (l) {
    var g = document.getElementById(l.id);
    var bb = l.shape.getBBox();
    var cx = bb.x + l.cx * bb.width;
    var cy = bb.y + l.cy * bb.height;
    g.setAttribute('gradientUnits', 'userSpaceOnUse');
    g.setAttribute('cx', cx);
    g.setAttribute('cy', cy);
    g.setAttribute('fx', cx);
    g.setAttribute('fy', cy);
    g.setAttribute('r', l.r * (bb.width + bb.height) / 2);
    l.el = g;
    l.px = l.pivotOnSvg ? 100 : bb.x + bb.width / 2;
    l.py = l.pivotOnSvg ? 100 : bb.y + bb.height / 2;
  });

  var SHADOW_DISTANCE = 14; // matches the original 0 14px drop shadow, straight down on screen
  function applyLighting(angleDeg) {
    LIGHTING.forEach(function (l) {
      l.el.setAttribute('gradientTransform', 'rotate(' + (-angleDeg).toFixed(2) + ' ' + l.px + ' ' + l.py + ')');
    });
    var rad = angleDeg * Math.PI / 180;
    svgEl.style.setProperty('--shx', (SHADOW_DISTANCE * Math.sin(rad)).toFixed(2) + 'px');
    svgEl.style.setProperty('--shy', (SHADOW_DISTANCE * Math.cos(rad)).toFixed(2) + 'px');
  }

  var lastLightingAngle = null;
  function lightingLoop() {
    var m = new DOMMatrixReadOnly(getComputedStyle(svgEl).transform);
    var angle = Math.atan2(m.b, m.a) * 180 / Math.PI;
    if (lastLightingAngle === null || Math.abs(angle - lastLightingAngle) > 0.05) {
      applyLighting(angle);
      lastLightingAngle = angle;
    }
    requestAnimationFrame(lightingLoop);
  }
  lightingLoop();

  // Deepest inscribed point of the dark half, in the SVG's own 200x200
  // viewBox space (found by rendering the SVG to a canvas and searching
  // for the dark pixel farthest from any non-dark pixel). Using the
  // SVG's own coordinate space — via getScreenCTM() below — rather than a
  // plain bounding-box fraction matters because the symbol keeps spinning
  // right up until scroll starts: a screen-pixel fraction would silently
  // go stale the moment the rotation moved on, landing the "safe" point
  // over the dark half instead.
  var SAFE_POINT = { x: 150, y: 126 };
  var SAFE_RADIUS_UNITS = 41; // clearance from SAFE_POINT to the nearest non-dark pixel, in viewBox units (measured by sampling the rendered SVG)
  var SAFE_MARGIN = 0.5; // use only half the measured clearance: covers anti-aliasing/gradient softness at the boundary AND the rotateY twist, which foreshortens one side of the frame so it needs extra scale to still reach the edge
  var MAX_SCALE = 12; // recomputed from real measurements in updateOrigin(); this is just a safe fallback before the first measurement
  var TURN_START = 4;   // deg
  var TURN_END = 26;    // deg

  var spinFrozen = false;
  function freezeSpin() {
    if (spinFrozen) return;
    spinFrozen = true;
    svgEl.style.animationPlayState = 'paused';
  }
  function unfreezeSpin() {
    if (!spinFrozen) return;
    spinFrozen = false;
    svgEl.style.animationPlayState = '';
  }

  // transform-origin must be expressed in the element's own LOCAL,
  // untransformed coordinate space. getScreenCTM() reports the SVG's
  // position after every ancestor transform is applied — including
  // zoomLayer's own current scale/rotate — so this briefly resets that
  // transform to measure cleanly, then restores it. Calling it while
  // already mid-zoom would otherwise feed a post-transform screen
  // position back in as the pre-transform origin, a circular reference
  // that made the maths blow up.
  function updateOrigin() {
    zoomLayer.getAnimations({ subtree: true }).forEach(function (a) {
      if (a.animationName === 'pop') a.finish();
    });
    var prevTransform = zoomLayer.style.transform;
    zoomLayer.style.transform = 'none';
    void zoomLayer.offsetHeight; // force reflow before measuring
    var pt = svgEl.createSVGPoint();
    pt.x = SAFE_POINT.x;
    pt.y = SAFE_POINT.y;
    var ctm = svgEl.getScreenCTM();
    var screenPt = pt.matrixTransform(ctm);
    var layerRect = zoomLayer.getBoundingClientRect();
    var originX = screenPt.x - layerRect.left;
    var originY = screenPt.y - layerRect.top;
    zoomLayer.style.transformOrigin = originX + 'px ' + originY + 'px';

    // pxPerUnit: ctm.a/ctm.d scale the SVG's local x/y axes to screen px.
    // Work out how far the origin sits from each viewport edge, take the
    // largest (the far corner the zoom has to cover), and size MAX_SCALE
    // so the dark half's own safe clearance — not a guessed constant —
    // is exactly what has to stretch that far.
    var pxPerUnit = (Math.abs(ctm.a) + Math.abs(ctm.d)) / 2;
    var safePx = SAFE_RADIUS_UNITS * SAFE_MARGIN * pxPerUnit;
    var originScreenX = originX + layerRect.left;
    var originScreenY = originY + layerRect.top;
    var reachX = Math.max(originScreenX, window.innerWidth - originScreenX);
    var reachY = Math.max(originScreenY, window.innerHeight - originScreenY);
    var reach = Math.sqrt(reachX * reachX + reachY * reachY);
    MAX_SCALE = Math.max(4, reach / safePx);

    zoomLayer.style.transform = prevTransform;
  }

  var ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      var rect = heroScroll.getBoundingClientRect();
      var scrollable = heroScroll.offsetHeight - window.innerHeight;
      var progress = scrollable > 0 ? Math.min(Math.max(-rect.top / scrollable, 0), 1) : 0;

      if (progress > 0) {
        if (!spinFrozen) {
          freezeSpin();
          updateOrigin();
        }
      } else {
        unfreezeSpin();
      }

      scrollHint.style.visibility = progress > 0.02 ? 'hidden' : '';
      blendStops(progress);
      var scale = 1 + progress * (MAX_SCALE - 1);
      var turn = TURN_START + (TURN_END - TURN_START) * progress;
      zoomLayer.style.transform = 'scale(' + scale.toFixed(3) + ') rotateY(' + turn.toFixed(2) + 'deg)';

      ticking = false;
    });
  }

  onScroll();
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', function () {
    if (spinFrozen) updateOrigin();
    onScroll();
  });
})();
</script>
</body>
</html>
