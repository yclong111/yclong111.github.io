</head>

  <svg class="st opt" style="--x:89%;--y:24%;--s:10vmin;--r:-10deg;color:#d62839" aria-hidden="true"><use href="scrapbook.svg#star" width="100%" height="100%"/></svg>

  <span class="st emo opt" style="--x:55%;--y:3%;--s:12vmin;--r:6deg" aria-hidden="true">🎆</span>

  <main class="center">
    <div class="title-wrap">
      <svg class="st scrib orbit" aria-hidden="true"><use href="scrapbook.svg#orbit" width="100%" height="100%"/></svg>
      <span class="label">Stage 1</span>
      <div class="tiles"><div class="word"><span class="tile">T</span><span class="tile">H</span><span class="tile">E</span></div><div class="word"><span class="tile">U</span><span class="tile">S</span></div></div>
      <div class="flag-sticker" aria-hidden="true">🇺🇸</div>
    </div>

    <div class="row">
      <figure class="polaroid" style="--r:-6deg;--a:#9bbcf2;--b:#f2a1ab"><span class="tape"></span><div class="pic">📷</div><figcaption>Lower Merion, PA</figcaption></figure>
      <div class="note"><span class="tape"></span><p>Where the story begins — growing up in Lower Merion, Pennsylvania. Swap this copy and add photos for your years in the US.</p></div>
      <figure class="polaroid" style="--r:5deg;--a:#ffe9a3;--b:#9bd3b0"><span class="tape"></span><div class="pic">📷</div><figcaption>add a photo</figcaption></figure>
    </div>

    <a class="back" href="./">&larr; back to the yin and yang</a>
  </main>
