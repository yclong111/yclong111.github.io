<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stage 1: The US</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100vh; }
  body{
    background:#f2f0e8;
    color:#1c2b33;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1.25rem; text-align:center; padding:4rem 1.5rem;
  }
  .flag{ font-size:64px; line-height:1; }
  h1{
    margin:0; font-weight:500; font-size:clamp(28px,6vw,56px);
    letter-spacing:0.06em; text-transform:uppercase;
    text-shadow:0 0 10px rgba(125,211,252,0.55), 0 0 26px rgba(125,211,252,0.35), 0 0 52px rgba(125,211,252,0.2);
  }
  p{ margin:0; max-width:36rem; font-size:17px; line-height:1.6; color:#4a4a4a; }
  a{
    margin-top:1rem; color:#1c2b33; text-decoration:none; font-size:13px;
    letter-spacing:0.12em; text-transform:uppercase;
    border:1px solid #1c2b33; padding:0.7rem 1.4rem; border-radius:999px;
    transition:background .2s, color .2s;
  }
  a:hover, a:focus-visible{ background:#1c2b33; color:#f2f0e8; }
</style>
</head>
<body>
  <div class="flag" aria-hidden="true">🇺🇸</div>
  <h1>Stage 1: The US</h1>
  <p>Where the story begins — growing up in Lower Merion, Pennsylvania. Swap this copy and add photos for your years in the US.</p>
  <a href="./">Back to the yin and yang</a>
</body>
</html>
